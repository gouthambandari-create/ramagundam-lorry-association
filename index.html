<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WheelsEye - Vehicle Tracking Portal</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN VIEW -->
  <div class="card" id="loginCard">
    <h1 class="brand">WheelsEye</h1>
    <h2 class="title">Vehicle Tracking Portal</h2>
    <p class="subtitle">Sign in to view your assigned vehicles.</p>

    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" />

    <p class="error" id="loginError"></p>

    <button id="loginBtn">Login</button>
  </div>

  <!-- DASHBOARD VIEW (hidden until login) -->
  <div class="dashboard" id="dashboardCard" style="display:none;">
    <div class="dashboard-header">
      <h1 class="brand">WheelsEye</h1>
      <button id="logoutBtn">Logout</button>
    </div>
    <h2 class="title">Vehicle Locations</h2>
    <p class="subtitle" id="statusMsg">Loading vehicle data...</p>

    <div class="table-wrap">
      <table id="vehicleTable" style="display:none;">
        <thead>
          <tr>
            <th>Vehicle No.</th>
            <th>Driver</th>
            <th>Location (Lat, Long)</th>
            <th>Last Updated</th>
          </tr>
        </thead>
        <tbody id="vehicleTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
